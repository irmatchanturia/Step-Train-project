<header class="site-header">
  <a class="brand" routerLink="/">
    <span class="brand-icon">↝</span>
    <span>STEPTRAINS</span>
  </a>

  <nav class="main-navigation" aria-label="Main navigation">
    <a
      class="nav-link"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Home
    </a>

    <a class="nav-link" routerLink="/trains" routerLinkActive="active"> Trains </a>

    @if (isAuthenticated()) {
      <a class="nav-link" routerLink="/profile" routerLinkActive="active"> My Profile </a>
    }
  </nav>

  @if (!isAuthenticated()) {
    <div class="header-actions">
      <a class="sign-in-link" routerLink="/sign-in"> Sign In </a>

      <a class="get-started-button" routerLink="/sign-up"> Get Started </a>
    </div>
  }
</header>
