<header class="site-header">
  <a class="brand" routerLink="/">
    <span class="brand-icon">🚆</span>
    <span>Step Trains</span>
  </a>

  <nav class="main-navigation">
    <a
      class="nav-link"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      {{ 'HEADER.HOME' | translate }}
    </a>

    <a class="nav-link" routerLink="/trains" routerLinkActive="active">
      {{ 'HEADER.TRAINS' | translate }}
    </a>

    @if (isAuthenticated()) {
      <a class="nav-link" routerLink="/profile" routerLinkActive="active">
        {{ 'HEADER.MY_PROFILE' | translate }}
      </a>
    }
  </nav>

  <div class="header-actions">
    <div class="language-switcher">
      <button
        type="button"
        [class.active]="selectedLanguage === 'ka'"
        (click)="switchLanguage('ka')"
      >
        KA
      </button>

      <button
        type="button"
        [class.active]="selectedLanguage === 'en'"
        (click)="switchLanguage('en')"
      >
        EN
      </button>
    </div>

    @if (!isAuthenticated()) {
      <a class="sign-in-link" routerLink="/sign-in">
        {{ 'HEADER.SIGN_IN' | translate }}
      </a>

      <a class="get-started-button" routerLink="/sign-up">
        {{ 'HEADER.GET_STARTED' | translate }}
      </a>
    } @else {
      <button class="logout-button" type="button" (click)="logout()">
        {{ 'HEADER.LOG_OUT' | translate }}
      </button>
    }
  </div>
</header>
