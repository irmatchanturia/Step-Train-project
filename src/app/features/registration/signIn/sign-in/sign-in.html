<main class="sign-in-page">
  <section class="brand-section">
    <div class="grid-background" aria-hidden="true"></div>

    <div class="brand-content">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M8 7V5.5C8 4.12 9.12 3 10.5 3h3C14.88 3 16 4.12 16 5.5V7" />
          <rect x="4" y="7" width="16" height="12" rx="2" />
          <path d="M9 7v12M15 7v12" />
        </svg>
      </div>

      <h1>STEP TRAINS</h1>

      <p class="brand-description">Book train tickets and manage your trips with your account.</p>

      <div class="statistics">
        <div class="statistic-item">
          <strong>500+</strong>
          <span>Routes</span>
        </div>

        <div class="statistic-item">
          <strong>50+</strong>
          <span>Stations</span>
        </div>

        <div class="statistic-item">
          <strong>24/7</strong>
          <span>Support</span>
        </div>
      </div>
    </div>
  </section>

  <section class="form-section">
    <div class="form-container">
      <div class="sign-in-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M10 17l5-5-5-5" />
          <path d="M15 12H3" />
          <path d="M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5" />
        </svg>
      </div>

      <div class="form-heading">
        <h2>Welcome back</h2>
        <p>Sign in to book your next trip</p>
      </div>

      <form class="sign-in-form" (ngSubmit)="signIn()">
        <label class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m4 7 8 6 8-6" />
          </svg>

          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Email address"
            autocomplete="email"
            required
          />
        </label>

        <label class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24">
            <rect x="5" y="10" width="14" height="11" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>

          <input
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
        </label>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" />
            <span>Remember me</span>
          </label>

          <button class="forgot-password" type="button">Forgot password?</button>
        </div>

        <button class="sign-in-button" type="submit" [disabled]="isLoading">
          @if (isLoading) {
            <span class="button-loader" aria-hidden="true"></span>
            <span>Signing in...</span>
          } @else {
            <span>Sign In</span>
          }
        </button>

        @if (successMessage) {
          <p class="message success-message" aria-live="polite">
            {{ successMessage }}
          </p>
        }

        @if (errorMessage) {
          <p class="message error-message" aria-live="polite">
            {{ errorMessage }}
          </p>
        }
      </form>

      <div class="divider">
        <span></span>
        <p>or</p>
        <span></span>
      </div>

      <p class="create-account-text">
        Don’t have an account?
        <a routerLink="/sign-up">Create one now</a>
      </p>
    </div>
  </section>
</main>
